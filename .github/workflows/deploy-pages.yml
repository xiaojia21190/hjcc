name: Refresh data and deploy Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - data/dashboard.json
      - public/dashboard.json
  workflow_dispatch:
  schedule:
    # 14:00 UTC = 22:00 Asia/Shanghai, Monday through Friday.
    # 上交所/深交所 ETF T 日总份额通常于 T 日晚间（约 19:00–21:00 北京时间）发布，
    # 16:30 跑会拿不到当日份额。22:00 抓取可确保���交易所 T 日份额已落地。
    - cron: '0 14 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # 正常一轮 12~51 分钟；卡死时避免默认 6 小时超时长期阻塞 github-pages 并发组
    timeout-minutes: 90
    env:
      VITE_STATIC_DEPLOY: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh public data
        run: bun run fetch

      - name: Build site
        run: bun run build

      - name: Audit generated data
        run: bun run audit

      - name: Save refreshed snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/dashboard.json public/dashboard.json
          git diff --cached --quiet || git commit -m "chore(data): refresh dashboard snapshot"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
